# Configure an Azure Resource Manager service connection using workload identity
# federation, then set AZURE_SERVICE_CONNECTION in pipeline variables.
# Configure ACR_NAME, RESOURCE_GROUP, and CONTAINER_APP_NAME from terraform output.
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - azure/*
      - app/*
      - Dockerfile
      - requirements.txt

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - script: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt pytest
      pytest -q
    displayName: Test FastAPI application

  - task: AzureCLI@2
    displayName: Build, push and deploy to Azure Container Apps
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        IMAGE="${ACR_NAME}.azurecr.io/cloudpulse:${BUILD_SOURCEVERSION}-${BUILD_BUILDID}"
        az acr login --name "$ACR_NAME"
        docker build -t "$IMAGE" .
        docker push "$IMAGE"
        az containerapp update \
          --name "$CONTAINER_APP_NAME" \
          --resource-group "$RESOURCE_GROUP" \
          --image "$IMAGE"
        FQDN=$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
        curl --fail --retry 12 --retry-delay 10 --retry-all-errors "https://$FQDN/health"
    env:
      ACR_NAME: $(ACR_NAME)
      RESOURCE_GROUP: $(RESOURCE_GROUP)
      CONTAINER_APP_NAME: $(CONTAINER_APP_NAME)
