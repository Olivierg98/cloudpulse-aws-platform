apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudpulse
  namespace: flux-system
spec:
  interval: 1m
  releaseName: cloudpulse
  targetNamespace: cloudpulse
  timeout: 45s
  chart:
    spec:
      chart: ./kubernetes/chart
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: cloudpulse
  upgrade:
    remediation:
      retries: 0
  values:
    image:
      tag: v1
