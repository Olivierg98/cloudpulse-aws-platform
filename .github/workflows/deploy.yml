name: Deploy AWS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, prod]

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudpulse-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false
      AWS_REGION: eu-west-2
      TF_DIR: infra/environments/${{ inputs.environment }}
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure remote state
        run: |
          cp "$TF_DIR/backend.tf.example" "$TF_DIR/backend.tf"
          sed -i "s/REPLACE_WITH_STATE_BUCKET/${{ secrets.TF_STATE_BUCKET }}/" "$TF_DIR/backend.tf"

      - name: Initialise Terraform
        run: terraform -chdir="$TF_DIR" init

      - name: Provision ECR repository
        run: |
          if [ "${{ inputs.environment }}" = "prod" ]; then
            terraform -chdir="$TF_DIR" apply -auto-approve \
              -target=module.platform.aws_ecr_repository.app \
              -var="app_image=public.ecr.aws/docker/library/nginx:stable-alpine"
          else
            terraform -chdir="$TF_DIR" apply -auto-approve \
              -target=module.platform.aws_ecr_repository.app
          fi

      - name: Resolve ECR repository
        id: ecr
        run: echo "repository=$(terraform -chdir="$TF_DIR" output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"

      - name: Sign in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable image
        env:
          REPOSITORY: ${{ steps.ecr.outputs.repository }}
        run: |
          docker build --tag "$REPOSITORY:$IMAGE_TAG" .
          docker push "$REPOSITORY:$IMAGE_TAG"

      - name: Deploy immutable application image
        run: |
          IMAGE_DIGEST=$(aws ecr describe-images \
            --repository-name "${{ inputs.environment == 'prod' && 'cloudpulse-prod' || 'cloudpulse-dev' }}" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' --output text)
          IMAGE_URI="${{ steps.ecr.outputs.repository }}@$IMAGE_DIGEST"
          if [ "${{ inputs.environment }}" = "prod" ]; then
            terraform -chdir="$TF_DIR" apply -auto-approve \
              -var="app_image=$IMAGE_URI" \
              -var="certificate_arn=${{ secrets.ACM_CERTIFICATE_ARN }}" \
              -var="alarm_email=${{ secrets.ALARM_EMAIL }}"
          else
            terraform -chdir="$TF_DIR" apply -auto-approve -var="app_image=$IMAGE_URI"
          fi

      - name: Smoke test
        run: ./scripts/smoke-test.sh "$(terraform -chdir="$TF_DIR" output -raw application_url)"

      - name: Write deployment summary
        run: |
          echo "### CloudPulse deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: ${{ inputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image tag: $IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $(terraform -chdir="$TF_DIR" output -raw application_url)" >> "$GITHUB_STEP_SUMMARY"
name: Deploy AWS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, prod]

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudpulse-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false
      AWS_REGION: eu-west-2
      TF_DIR: infra/environments/${{ inputs.environment }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Diagnose GitHub OIDC claims
        shell: bash
        run: |
          RESPONSE=$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          export OIDC_TOKEN=$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$RESPONSE")
          python - <<'PY'
          import base64
          import json
          import os

          payload = os.environ["OIDC_TOKEN"].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          safe_keys = ("sub", "aud", "repository", "repository_owner", "environment", "ref")
          print(json.dumps({key: claims.get(key) for key in safe_keys}, indent=2))
          PY

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure remote state
        run: |
          cp "$TF_DIR/backend.tf.example" "$TF_DIR/backend.tf"
          sed -i "s/REPLACE_WITH_STATE_BUCKET/${{ secrets.TF_STATE_BUCKET }}/" "$TF_DIR/backend.tf"

      - name: Initialise Terraform
        run: terraform -chdir="$TF_DIR" init

      - name: Provision ECR repository
        run: |
          if [ "${{ inputs.environment }}" = "prod" ]; then
            terraform -chdir="$TF_DIR" apply -auto-approve \
              -target=module.platform.aws_ecr_repository.app \
              -var="app_image=public.ecr.aws/docker/library/nginx:stable-alpine"
          else
            terraform -chdir="$TF_DIR" apply -auto-approve \
              -target=module.platform.aws_ecr_repository.app
          fi

      - name: Resolve ECR repository
        id: ecr
        run: echo "repository=$(terraform -chdir="$TF_DIR" output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"

      - name: Sign in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable image
        env:
          REPOSITORY: ${{ steps.ecr.outputs.repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --tag "$REPOSITORY:$IMAGE_TAG" .
          docker push "$REPOSITORY:$IMAGE_TAG"

      - name: Deploy immutable application image
        run: |
          IMAGE_DIGEST=$(aws ecr describe-images \
            --repository-name "${{ inputs.environment == 'prod' && 'cloudpulse-prod' || 'cloudpulse-dev' }}" \
            --image-ids imageTag="${{ github.sha }}" \
            --query 'imageDetails[0].imageDigest' --output text)
          IMAGE_URI="${{ steps.ecr.outputs.repository }}@$IMAGE_DIGEST"
          if [ "${{ inputs.environment }}" = "prod" ]; then
            terraform -chdir="$TF_DIR" apply -auto-approve \
              -var="app_image=$IMAGE_URI" \
              -var="certificate_arn=${{ secrets.ACM_CERTIFICATE_ARN }}" \
              -var="alarm_email=${{ secrets.ALARM_EMAIL }}"
          else
            terraform -chdir="$TF_DIR" apply -auto-approve -var="app_image=$IMAGE_URI"
          fi

      - name: Smoke test
        run: ./scripts/smoke-test.sh "$(terraform -chdir="$TF_DIR" output -raw application_url)"

      - name: Write deployment summary
        run: |
          echo "### CloudPulse deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: ${{ inputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $(terraform -chdir="$TF_DIR" output -raw application_url)" >> "$GITHUB_STEP_SUMMARY"
